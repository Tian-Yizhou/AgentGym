[project]
name = "agentenv_textworldexpress"
version = "0.0.1"
description = "AgentGym environment server for TextWorldExpress (cookingworld, coin, twc, mapreader, arithmetic, sorting, simonsays, peckingorder)"
dependencies = [
    "fastapi>=0.95",
    "uvicorn",
    "textworld-express==1.1.0",
    "py4j",
    "orjson",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
textworldexpress = "agentenv_textworldexpress:launch"

[tool.setuptools]
packages = ["agentenv_textworldexpress"]
